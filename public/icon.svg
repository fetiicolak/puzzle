<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Birlikte Puzzle">
  <!--
    Birbirine geçmiş iki parça: uygulamanın adı "Birlikte" ama ikon tek parça
    gösteriyordu. Renkler oyunun kendi oyuncu paletinden geliyor
    (board.ts -> peerColor): #e85d75 ve #56ccf2. İkon artık "iki kişi, tek
    yapboz" diyor.

    Merkezleme: çizim kutusu x 24-76, y 24-76 — tam kare ve iki eksende de
    merkezi 50. Eski ikon aşağı kaymıştı (üstte 110, altta 57 piksel boşluk
    vardı). Çıkıntılar üstte-solda / altta-sağda, oyuklar iki dış kenarda:
    denge kendiliğinden çıkıyor, elle itelemek gerekmiyor.

    Yarıçap 40'ı geçmiyor (kontur payıyla 38,2). Android "maskable" ikonu
    daireye kırpıyor; taşan köşe kesilirdi.

    Koyu kontur zeminle aynı renk: dış hatta görünmüyor, ortadaki dikişte iki
    parçayı ayırıyor. 16 pikselde bile iki ayrı renk okunuyor.

    PNG'ler bu dosyadan üretiliyor (bağımlılık eklemeden, npx ile):
      # yuvarlak köşeli: icon-192.png, icon-512.png
      # kare (rx="22" silinerek): icon-512-maskable.png ve apple-touch-icon*
      npx --yes sharp-cli -i <boyutu yazılmış kopya>.svg -o cikti.png -f png
    Boyut, kopyada <svg width="N" height="N"> olarak veriliyor; sharp yoksa
    100x100 rasterleyip büyütüyor ve kenarlar bulanıyor.

    Yuvarlatmayı yalnızca SVG ve icon-*.png taşır. apple-touch-icon ve
    maskable kare olmalı: iOS ve Android kendi maskesini uyguluyor, önden
    yuvarlatılmış ikon orada çift yuvarlak / kesik köşe oluyor.
  -->
  <defs>
    <linearGradient id="sol" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff8fa4" />
      <stop offset="1" stop-color="#d6415f" />
    </linearGradient>
    <linearGradient id="sag" x1="0.1" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ce3fb" />
      <stop offset="1" stop-color="#2f9dd4" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#1a1423" />

  <g stroke="#1a1423" stroke-width="2" stroke-linejoin="round">
    <!-- sol parça: üstte tırnak, sağında dikiş tırnağı -->
    <path d="M24 31 H30 A7 7 0 0 1 44 31 H50 V43 A7 7 0 0 1 50 57 V69 H24 Z" fill="url(#sol)" />
    <!-- sağ parça: sol kenarındaki oyuk sol parçanın tırnağını alıyor -->
    <path d="M50 31 H76 V69 H70 A7 7 0 0 1 56 69 H50 V57 A7 7 0 0 0 50 43 Z" fill="url(#sag)" />
  </g>
</svg>
