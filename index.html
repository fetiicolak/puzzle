<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120e1a" />
    <meta name="description" content="Sevdiklerinle aynı puzzle'ı birlikte çöz." />
    <title>Birlikte Puzzle</title>

    <!-- Sosyal mecrada / mesajlaşmada link paylaşılınca çıkan önizleme.
         Ürün davet linki paylaşma üzerine kurulu; bunlar olmadan çıplak
         adres görünüyordu. Oda kodu #room= parçasında olduğu için
         önizlemeye sızmaz. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Birlikte Puzzle" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="Birlikte Puzzle" />
    <meta
      property="og:description"
      content="Fotoğrafını seç, linki gönder, aynı puzzle'ı beraber çözün."
    />
    <meta property="og:url" content="https://fetiicolak.github.io/puzzle/" />
    <meta property="og:image" content="https://fetiicolak.github.io/puzzle/kapak.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Birlikte Puzzle" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Birlikte Puzzle" />
    <meta
      name="twitter:description"
      content="Fotoğrafını seç, linki gönder, aynı puzzle'ı beraber çözün."
    />
    <meta name="twitter:image" content="https://fetiicolak.github.io/puzzle/kapak.jpg" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />

    <!-- iOS manifest ikonlarını kullanmaz; apple-touch-icon PNG şart.
         Yol göreli değil kök-göreli olmalı, yoksa Safari bulamıyor. -->
    <link rel="apple-touch-icon" href="/puzzle/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/puzzle/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/puzzle/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/puzzle/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/puzzle/apple-touch-icon-180.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Puzzle" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
